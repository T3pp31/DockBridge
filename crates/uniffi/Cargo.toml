[package]
name = "dockbridge-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DockBridge UniFFI bridge for Swift/macOS"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "dockbridge_uniffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
dockbridge-core = { path = "../core" }
tokio.workspace = true
uniffi = { workspace = true, default-features = false }
zeroize.workspace = true

[build-dependencies]
uniffi = { workspace = true, default-features = false, features = ["build"] }

[dev-dependencies]
dockbridge-core = { path = "../core", features = ["test-support"] }
