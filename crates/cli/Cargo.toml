[package]
name = "dockbridge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DockBridge CLI for SFTP operations"

[[bin]]
name = "dockbridge"
path = "src/main.rs"

[features]
default = []
# Remove the insecure --password CLI flag; only --password-stdin remains.
disable-cli-password = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
dockbridge-core = { path = "../core" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
serial_test = "3"
tempfile = "3"
