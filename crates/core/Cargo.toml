[package]
name = "dockbridge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DockBridge SSH/SFTP core library"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
hmac.workspace = true
libc = "0.2"
# rand 0.10 is the current stable series on crates.io; the default
# features already provide rng/thread_rng APIs.
rand = "0.10"
russh.workspace = true
russh-sftp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
subtle.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
rand = "0.10"
ssh-key.workspace = true
tempfile = "3"
