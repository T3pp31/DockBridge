[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/uniffi",
    "crates/cli",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/T3pp31/DockBridge"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
subtle = "2"
sha2 = "0.11"
ssh-key = "=0.7.0-rc.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
russh = { version = "0.61", features = ["async-trait", "des"] }
russh-sftp = "2.3"
uniffi = { version = "0.32", features = ["cli"] }
