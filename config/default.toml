# DockBridge CLI default configuration.
# The macOS app builds AppConfig in Swift and passes it via UniFFI.

connection_timeout_secs = 30
session_health_check_interval_secs = 10
transfer_retry_count = 3
# Allowed range: 4096 bytes (4 KiB) to 8388608 bytes (8 MiB).
transfer_chunk_size_bytes = 262144
# Concurrent in-flight READ requests per download (pipelined reads hide
# round-trip latency). OpenSSH sftp uses ~64; range 1..=256.
# Peak buffered memory is kept near depth × transfer_chunk_size_bytes by
# scaling depth when the chunk is smaller than the ~256 KiB packet ceiling.
transfer_download_pipeline_depth = 64
# Concurrent in-flight WRITE requests per upload (pipelined writes hide
# round-trip latency). OpenSSH sftp uses ~64; range 1..=256.
# Peak buffered memory is bounded by depth × negotiated WRITE payload
# (at most roughly 256 KiB per request).
transfer_upload_pipeline_depth = 64
known_hosts_path = "~/.dockbridge/known_hosts.json"
openssh_known_hosts_path = "~/.ssh/known_hosts"
merge_openssh_known_hosts_on_connect = true
# When true, only exact host/port matches trust stored keys (no fingerprint alias fallback).
known_hosts_strict_mode = true
# When true, abort connection if merging OpenSSH known_hosts fails.
fail_connect_on_openssh_merge_error = true
directory_walk_max_files = 100000
directory_walk_max_depth = 64
directory_walk_max_total_bytes = 107374182400
# Time with no SSH traffic before the session is considered dead (independent
# of connection_timeout_secs, which budgets the TCP/SSH handshake). None
# disables idle-based expiry.
ssh_inactivity_timeout_secs = 600
# Interval (seconds) between SSH keepalive packets so idle sessions survive
# NAT/firewall timeouts without relying on the SFTP health checker.
ssh_keepalive_interval_secs = 30
