[release]
version = "0.1.6"
app_name = "DockBridge"
min_macos = "15.0"
github_repo = "T3pp31/DockBridge"
asset_name_template = "{app_name}-{version}-macOS.dmg"
bundle_identifier = "com.dockbridge.app"
# Set when SIGN_AND_NOTARIZE=true in the release workflow.
team_id = ""
signing_certificate_fingerprint_sha256 = ""
require_signed_updates = false
require_notarized_updates = false
# SBOM (CycloneDX JSON, source SBOM from Cargo.lock via cargo-cyclonedx)
sbom_name_template = "{app_name}-{version}.cdx.json"
sbom_manifest_path = "crates/cli/Cargo.toml"
cargo_cyclonedx_version = "0.5.9"
cyclonedx_spec_version = "1.5"
