name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  website:
    name: Website download
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test website download behavior (offline)
        run: node --test scripts/test-website-download.cjs

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: ci-rust
          # Keep ~/.cargo/bin out of rust-cache so the dedicated cargo-cyclonedx
          # cache key (version-pinned) remains authoritative.
          cache-bin: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Shellcheck scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x scripts/*.sh
          else
            echo 'shellcheck not installed; installing...'
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
            shellcheck -x scripts/*.sh
          fi

      - name: Test demo host-key setup
        run: python3 scripts/test-demo-host-key.py
      - name: Test E2E log cleanup
        run: python3 scripts/test-e2e-verify.py
      - name: Test SBOM publication
        run: python3 scripts/test-generate-sbom.py
      - name: Test release notes extraction
        run: python3 scripts/test-release-notes.py
      - name: Test release configuration reader and workflow guards
        run: python3 scripts/test-release-config.py
      - name: Test signing identity resolution (mocked macOS commands)
        run: python3 scripts/test-sign-and-notarize-macos.py
      - name: Test transfer-cancel verification diagnostics
        run: python3 scripts/test-verify-transfer-cancel.py
      - name: Test update-popup verification diagnostics
        run: python3 scripts/test-verify-update-popup.py
      - name: Test app icon generation script
        run: python3 scripts/test-generate-app-icon-icns.py -v
      - name: Test development installer
        run: python3 scripts/test-dev-install-unsigned.py -v
      - name: Test UniFFI generation scripts (mocked tools)
        run: python3 scripts/test-generate-uniffi.py
      - name: Test website install instructions
        run: python3 scripts/test-website-install.py
      - name: Test hello-world documentation credential flow
        run: python3 scripts/test-hello-world-docs.py
      - name: Test Rust test documentation consistency
        run: python3 scripts/test-rust-test-docs.py
      - name: Test shared xcodebuild settings (mocked tools)
        run: python3 scripts/test-ci-xcodebuild.py -v
      - name: Test macOS Rust test coverage
        run: python3 scripts/test-ci-macos-rust.py -v
      - name: Test macOS test result count and skip verification
        run: python3 scripts/test-verify-macos-test-results.py -v
      - name: Test release download verification instructions (offline)
        run: python3 scripts/test-release-download-docs.py
      - name: Test release security documentation consistency
        run: python3 scripts/test-release-security-docs.py
      - name: Test localization verification script
        run: python3 scripts/test-verify-localization.py
      - name: Test UI/UX tracking document consistency
        run: python3 scripts/test-ui-ux-tracking.py
      - name: Test Settings scene wiring guard
        run: python3 scripts/test-settings-scene.py
      - name: Test release workflow test gate
        run: python3 scripts/test-release-gating.py
      - name: Test advisory expiry check
        run: python3 scripts/test-check-advisory-expiry.py
      - name: Test scheduled security audit workflow permissions
        run: python3 scripts/test-security-audit-workflow.py
      - name: Test vendored SFTP fork version check
        run: python3 scripts/test-verify-vendored-sftp-fork.py

      - name: Verify the vendored SFTP fork is resolved
        run: python3 scripts/verify-vendored-sftp-fork.py

      - name: Check version consistency (Cargo.toml == release.toml)
        run: |
          cargo_version="$(bash scripts/release-config.sh --cargo-version)"
          release_version="$(bash scripts/release-config.sh version)"
          if [[ "$cargo_version" != "$release_version" ]]; then
            echo "error: Cargo.toml version ($cargo_version) != config/release.toml version ($release_version)" >&2
            exit 1
          fi
          echo "version=$cargo_version"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace (all targets)
        run: cargo test --workspace --all-targets

      - name: Test vendored SFTP crate and hardened CLI feature
        run: |
          cargo test -p bssh-russh-sftp --lib
          cargo test -p dockbridge-cli --features disable-cli-password

      - name: Build workspace
        run: cargo build --workspace

      - name: Check UniFFI bindgen CLI feature
        run: cargo check -p dockbridge-uniffi --features cli --bin uniffi-bindgen

      - name: Clippy UniFFI bindgen CLI feature
        run: cargo clippy -p dockbridge-uniffi --features cli --all-targets -- -D warnings

      - name: Ensure default UniFFI build excludes bindgen toolchain
        run: |
          tree="$(cargo tree -p dockbridge-uniffi -e normal --prefix none)"
          for crate in uniffi_bindgen askama goblin cargo_metadata; do
            if grep -Eq "^${crate} v" <<<"$tree"; then
              echo "::error::${crate} is in the default dockbridge-uniffi dependency graph; enable uniffi/cli only via the crate's cli feature."
              exit 1
            fi
          done

      - name: Build hardened CLI (release configuration)
        run: cargo build -p dockbridge-cli --release --features disable-cli-password

      - name: Resolve cargo-cyclonedx version
        id: cyclonedx
        run: |
          VERSION="$(bash scripts/release-config.sh cargo_cyclonedx_version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-cyclonedx
        id: cache-cyclonedx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: cargo-cyclonedx-${{ runner.os }}-${{ steps.cyclonedx.outputs.version }}

      - name: Install cargo-cyclonedx
        if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
        run: cargo install cargo-cyclonedx --version "${{ steps.cyclonedx.outputs.version }}" --locked

      - name: Generate and verify SBOM
        run: ./scripts/generate-sbom.sh --out dist

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dockbridge-sbom
          path: |
            dist/*.cdx.json
            dist/*.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  # MSRV job: guards against unintentionally raising rust-version. Uses
  # 1.91 (see [workspace.package] rust-version in Cargo.toml).
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # 1.91.0
        with:
          toolchain: 1.91.0

      # --all-targets also compiles unit tests and build scripts, so a dep that
      # only fails to link/codegen at 1.91 is caught here rather than at merge.
      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets

  # macOS job: compile/test only (unsigned). Release signing and notarization run in
  # .github/workflows/release.yml — see docs/security.md#release-signing-pipeline.
  macos:
    name: macOS
    # Pin the runner so Xcode/SDK changes cannot break CI silently
    # (macos-latest jumped to Xcode 26 and repeatedly hung testmanagerd).
    # macOS 15 + Xcode 16.4 matches project.yml / README requirements.
    runs-on: macos-15
    permissions:
      contents: read
    # Guard against xcodebuild test hangs (observed: no test output for 6h until
    # the default job timeout in run 34044968127). Normal duration is ~13 min.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test app icon generation script
        run: python3 scripts/test-generate-app-icon-icns.py -v

      - name: Test development installer
        run: python3 scripts/test-dev-install-unsigned.py -v

      - name: Test release configuration reader and workflow guards
        run: python3 scripts/test-release-config.py

      - name: Pin Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: '16.4'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: ci-macos
          # Keep ~/.cargo/bin out of rust-cache; macOS does not build cargo-cyclonedx,
          # but this prevents any unintended bin-cache interaction across jobs.
          cache-bin: false

      - name: Build Rust static library
        run: ./scripts/build-rust.sh "" debug

      - name: Generate UniFFI bindings
        run: ./scripts/generate-uniffi.sh "" debug

      - name: Verify localization catalog (en + ja)
        run: ./scripts/verify-localization.sh

      - name: Guard Settings scene state wiring
        run: python3 scripts/test-settings-scene.py

      - name: Build x86_64 (Intel) Rust static library
        run: |
          rustup target add x86_64-apple-darwin
          ./scripts/build-rust.sh x86_64-apple-darwin release
          lipo target/x86_64-apple-darwin/release/libdockbridge_uniffi.a \
            -verify_arch x86_64

      - name: Test Rust workspace (all targets)
        run: cargo test --workspace --all-targets

      - name: Install pinned XcodeGen
        run: |
          version="$(bash scripts/release-config.sh xcodegen_version)"
          checksum="$(bash scripts/release-config.sh xcodegen_sha256)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid xcodegen_version in config/release.toml"
            exit 1
          fi
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid xcodegen_sha256 in config/release.toml"
            exit 1
          fi
          archive="${RUNNER_TEMP}/xcodegen-${version}.zip"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${version}/xcodegen.zip"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify xcodeproj matches project.yml (xcodegen)
        run: |
          cd apps/macos
          xcodegen generate
          if ! git diff --exit-code DockBridge.xcodeproj; then
            echo "::error::DockBridge.xcodeproj is out of date. Run 'cd apps/macos && xcodegen generate' and commit the result."
            exit 1
          fi

      - name: Verify committed Swift bindings are up to date
        run: |
          if ! git diff --exit-code apps/macos/DockBridge/Generated/DockBridgeUniffi.swift; then
            echo "::error::DockBridgeUniffi.swift is out of date. Run ./scripts/generate-uniffi.sh locally and commit the result."
            exit 1
          fi

      - name: Build and test macOS app
        timeout-minutes: 33
        uses: ./.github/actions/run-macos-tests

      # Keep diagnostics outside the timed-out composite step so a step timeout
      # or Verify macOS test result counts failure still uploads logs/.xcresult (#266).
      - name: Upload macOS test diagnostics
        if: failure()
        uses: ./.github/actions/upload-macos-test-diagnostics
