name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          # Keep ~/.cargo/bin out of rust-cache so the dedicated cargo-cyclonedx
          # cache key (version-pinned) remains authoritative.
          cache-bin: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test core crate
        run: cargo test -p dockbridge-core

      - name: Build workspace
        run: cargo build --workspace

      - name: Build hardened CLI (release configuration)
        run: cargo build -p dockbridge-cli --release --features disable-cli-password

      - name: Resolve cargo-cyclonedx version
        id: cyclonedx
        run: |
          VERSION="$(awk -F'"' '/^cargo_cyclonedx_version / { print $2; exit }' config/release.toml)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-cyclonedx
        id: cache-cyclonedx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: cargo-cyclonedx-${{ runner.os }}-${{ steps.cyclonedx.outputs.version }}

      - name: Install cargo-cyclonedx
        if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
        run: cargo install cargo-cyclonedx --version "${{ steps.cyclonedx.outputs.version }}" --locked

      - name: Generate and verify SBOM
        run: ./scripts/generate-sbom.sh --out dist

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: dockbridge-sbom
          path: |
            dist/*.cdx.json
            dist/*.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  # macOS job: compile/test only (unsigned). Release signing and notarization run in
  # .github/workflows/release.yml — see docs/security.md#release-signing-pipeline.
  macos:
    name: macOS
    runs-on: macos-latest
    # Guard against xcodebuild test hangs (observed: no test output for 6h until
    # the default job timeout in run 34044968127). Normal duration is ~13 min.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos
          # Keep ~/.cargo/bin out of rust-cache; macOS does not build cargo-cyclonedx,
          # but this prevents any unintended bin-cache interaction across jobs.
          cache-bin: false

      - name: Build Rust static library
        run: ./scripts/build-rust.sh

      - name: Generate UniFFI bindings
        run: ./scripts/generate-uniffi.sh

      - name: Verify committed Swift bindings are up to date
        run: |
          if ! git diff --exit-code apps/macos/DockBridge/Generated/DockBridgeUniffi.swift; then
            echo "::error::DockBridgeUniffi.swift is out of date. Run ./scripts/generate-uniffi.sh locally and commit the result."
            exit 1
          fi

      - name: Build macOS app (for testing)
        timeout-minutes: 15
        working-directory: apps/macos
        env:
          # The CI steps above already built the static library and UniFFI
          # bindings, so the always-out-of-date preBuild phase skips its host
          # cargo build. Regenerating bindings from the same .a is idempotent.
          DOCKBRIDGE_SKIP_HOST_BUILD: "1"
        # build/test are split deliberately: combined `build test` hit the
        # Xcode 26 testmanagerd readiness hang on macos-latest (runs
        # 34044968127 / 34207249969 froze before "Testing started").
        run: |
          xcodebuild \
            -scheme DockBridge \
            -destination 'platform=macOS' \
            -configuration Debug \
            build-for-testing \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Test macOS app
        # Kill hung test runs early instead of burning the job timeout:
        # run 34220128583 froze mid-test for 38 minutes on macos-latest
        # (runner-side testmanagerd stall, actions/runner-images#13096).
        # Normal duration is under 2 minutes; two 7-minute guarded attempts
        # plus overhead stay under the 18-minute step timeout.
        timeout-minutes: 18
        working-directory: apps/macos
        env:
          DOCKBRIDGE_SKIP_HOST_BUILD: "1"
        # Runner-side stalls are flaky, not deterministic. A wall-clock guard
        # (perl alarm survives exec and SIGALRM-kills xcodebuild; gtimeout is
        # not preinstalled on macOS runners) distinguishes a hang (retry once
        # on a fresh testmanagerd) from a genuine test failure (fail fast,
        # never retried), preserving CI pass/fail semantics.
        run: |
          set -u
          if ! command -v perl >/dev/null 2>&1; then
            # Without perl the watchdog cannot run; fail fast instead of
            # letting exit 127 be misread as a hang and retried.
            echo "::error::perl not found; the test watchdog requires perl"
            exit 1
          fi
          MAX_ATTEMPTS=2
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            log="/tmp/xcodebuild-test-attempt-${attempt}.log"
            echo "::group::xcodebuild test (attempt ${attempt}/${MAX_ATTEMPTS})"
            rc=0
            perl -e 'alarm 420; exec @ARGV or exit 127' -- \
              xcodebuild \
              -scheme DockBridge \
              -destination 'platform=macOS' \
              -configuration Debug \
              test-without-building \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 120 \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" > "$log" 2>&1 || rc=$?
            cat "$log"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            # Genuine test failures are never retried: the TEST EXECUTE FAILED
            # footer (normal completion) or per-case failure lines (assertion
            # failed before a later stall killed xcodebuild) both fail the job.
            if grep -q "TEST EXECUTE FAILED" "$log" || grep -q "failed on '" "$log"; then
              exit "$rc"
            fi
            # Retry only an explicit watchdog kill (perl alarm => SIGALRM =>
            # exit 142). Any other nonzero exit (xcodebuild usage/destination
            # errors, crash) is deterministic and must fail fast.
            if [ "$rc" -eq 142 ] && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::xcodebuild test stalled (exit ${rc}); retrying once"
              # Kill only this step's own process group (the run shell, perl ->
              # exec xcodebuild, and its test subprocesses share one PGID).
              # Other jobs/workflows on a shared runner are in other process
              # groups, so a bare `pkill -f`/`pkill -x` could kill foreign
              # xcodebuild/DockBridge processes; `-g <pgid>` cannot (issue
              # #267). `pkill -x DockBridge` is dropped: the app under test is
              # launched through testmanagerd outside this PGID, so the
              # machine-wide match added cross-job risk for little gain.
              our_pgid=$(ps -o pgid= -p $$ | tr -d ' ')
              pkill -g "$our_pgid" -f 'xcodebuild.*test-without-building' 2>/dev/null || true
              sleep 5
              continue
            fi
            echo "::error::xcodebuild test failed (exit ${rc}, not a retryable stall)"
            exit "$rc"
          done
          echo "::error::xcodebuild test stalled after ${MAX_ATTEMPTS} attempts"
          exit 1
