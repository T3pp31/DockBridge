name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-rust
          # Keep ~/.cargo/bin out of rust-cache so the dedicated cargo-cyclonedx
          # cache key (version-pinned) remains authoritative.
          cache-bin: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Shellcheck scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh
          else
            echo 'shellcheck not installed; installing...'
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
            shellcheck scripts/*.sh
          fi

      - name: Check version consistency (Cargo.toml == release.toml)
        run: |
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          release_version="$(awk -F'"' '/^version = / { print $2; exit }' config/release.toml)"
          if [[ "$cargo_version" != "$release_version" ]]; then
            echo "error: Cargo.toml version ($cargo_version) != config/release.toml version ($release_version)" >&2
            exit 1
          fi
          echo "version=$cargo_version"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace (all targets)
        run: cargo test --workspace --all-targets

      - name: Build workspace
        run: cargo build --workspace

      - name: Build hardened CLI (release configuration)
        run: cargo build -p dockbridge-cli --release --features disable-cli-password

      - name: Resolve cargo-cyclonedx version
        id: cyclonedx
        run: |
          VERSION="$(awk -F'"' '/^cargo_cyclonedx_version / { print $2; exit }' config/release.toml)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-cyclonedx
        id: cache-cyclonedx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: cargo-cyclonedx-${{ runner.os }}-${{ steps.cyclonedx.outputs.version }}

      - name: Install cargo-cyclonedx
        if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
        run: cargo install cargo-cyclonedx --version "${{ steps.cyclonedx.outputs.version }}" --locked

      - name: Generate and verify SBOM
        run: ./scripts/generate-sbom.sh --out dist

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dockbridge-sbom
          path: |
            dist/*.cdx.json
            dist/*.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  # MSRV job: guards against unintentionally raising rust-version. Uses
  # 1.91 (see [workspace.package] rust-version in Cargo.toml).
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@8d8cc9a8e0d47b64af669de71110e76860d6afbd  # 1.91.0

      # --all-targets also compiles unit tests and build scripts, so a dep that
      # only fails to link/codegen at 1.91 is caught here rather than at merge.
      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets

  # macOS job: compile/test only (unsigned). Release signing and notarization run in
  # .github/workflows/release.yml — see docs/security.md#release-signing-pipeline.
  macos:
    name: macOS
    # Pin the runner so Xcode/SDK changes cannot break CI silently
    # (macos-latest jumped to Xcode 26 and repeatedly hung testmanagerd).
    # macOS 15 + Xcode 16.4 matches project.yml / README requirements.
    runs-on: macos-15
    permissions:
      contents: read
    # Guard against xcodebuild test hangs (observed: no test output for 6h until
    # the default job timeout in run 34044968127). Normal duration is ~13 min.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: '16.4'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-macos
          # Keep ~/.cargo/bin out of rust-cache; macOS does not build cargo-cyclonedx,
          # but this prevents any unintended bin-cache interaction across jobs.
          cache-bin: false

      - name: Build Rust static library
        run: ./scripts/build-rust.sh

      - name: Generate UniFFI bindings
        run: ./scripts/generate-uniffi.sh

      - name: Build x86_64 (Intel) Rust static library
        run: |
          rustup target add x86_64-apple-darwin
          ./scripts/build-rust.sh x86_64-apple-darwin release
          lipo target/x86_64-apple-darwin/release/libdockbridge_uniffi.a \
            -verify_arch x86_64

      - name: Install pinned XcodeGen
        run: |
          version="$(awk -F'"' '/^xcodegen_version / { print $2; exit }' config/release.toml)"
          checksum="$(awk -F'"' '/^xcodegen_sha256 / { print $2; exit }' config/release.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid xcodegen_version in config/release.toml"
            exit 1
          fi
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid xcodegen_sha256 in config/release.toml"
            exit 1
          fi
          archive="${RUNNER_TEMP}/xcodegen-${version}.zip"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${version}/xcodegen.zip"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify xcodeproj matches project.yml (xcodegen)
        run: |
          cd apps/macos
          xcodegen generate
          if ! git diff --exit-code DockBridge.xcodeproj; then
            echo "::error::DockBridge.xcodeproj is out of date. Run 'cd apps/macos && xcodegen generate' and commit the result."
            exit 1
          fi

      - name: Verify committed Swift bindings are up to date
        run: |
          if ! git diff --exit-code apps/macos/DockBridge/Generated/DockBridgeUniffi.swift; then
            echo "::error::DockBridgeUniffi.swift is out of date. Run ./scripts/generate-uniffi.sh locally and commit the result."
            exit 1
          fi

      - name: Build macOS app (for testing)
        timeout-minutes: 15
        working-directory: apps/macos
        env:
          # The CI steps above already built the static library and UniFFI
          # bindings, so the always-out-of-date preBuild phase skips its host
          # cargo build. Regenerating bindings from the same .a is idempotent.
          DOCKBRIDGE_SKIP_HOST_BUILD: "1"
        # build/test are split deliberately: combined `build test` hit the
        # Xcode 26 testmanagerd readiness hang on macos-latest (runs
        # 34044968127 / 34207249969 froze before "Testing started").
        run: |
          xcodebuild \
            -scheme DockBridge \
            -destination 'platform=macOS' \
            -configuration Debug \
            build-for-testing \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Test macOS app
        # Kill hung test runs early instead of burning the job timeout:
        # run 34220128583 froze mid-test for 38 minutes on macos-latest
        # (runner-side testmanagerd stall, actions/runner-images#13096).
        # Time budget (watchdog, worst-case, per-test timeout, and how
        # timeout-minutes covers them): see docs/ci.md. Worst case here is
        # 420s + 5s + 420s = 845s (~14.1 min), covered by timeout-minutes: 18.
        timeout-minutes: 18
        working-directory: apps/macos
        env:
          DOCKBRIDGE_SKIP_HOST_BUILD: "1"
        # Runner-side stalls are flaky, not deterministic. A wall-clock guard
        # (perl alarm survives exec and SIGALRM-kills xcodebuild; gtimeout is
        # not preinstalled on macOS runners) distinguishes a hang (retry once
        # on a fresh testmanagerd) from a genuine test failure (fail fast,
        # never retried), preserving CI pass/fail semantics.
        #
        # Retry decision sources, in order of trust:
        #   1. .xcresult (written to disk by xcodebuild, immune to stdio
        #      buffering): if it contains any failed test, the failure is real
        #      and must never be retried. This is the authoritative check.
        #   2. Log grep (TEST EXECUTE FAILED / 'failed on ') as a fallback for
        #      the case where the watchdog SIGALRM-killed xcodebuild before the
        #      .xcresult was finalized (missing/corrupt bundle).
        # E2E/verify tests that are skipped (XCTSkip) never appear as failures,
        # so a zero-failure .xcresult is safe to treat as "no real failure".
        # Per-test allowance: -default-test-execution-time-allowance 300 gives
        # loaded runners a wide margin over the ~2 min normal suite (run
        # 34231056581 failed a unit test at exactly 120 s under load). The
        # Docker/SSH E2E tests are skipped on CI via XCTSkip, so this limit
        # only guards genuinely hung unit tests; the 300 s value stays well
        # under the 420 s watchdog so the watchdog still distinguishes a stall.
        run: |
          set -u -o pipefail
          if ! command -v perl >/dev/null 2>&1; then
            # Without perl the watchdog cannot run; fail fast instead of
            # letting exit 127 be misread as a hang and retried.
            echo "::error::perl not found; the test watchdog requires perl"
            exit 1
          fi
          MAX_ATTEMPTS=2
          # TEST_HOST (DockBridge) is launched by testmanagerd outside this
          # step's process group. Snapshot PIDs that already existed so retry
          # cleanup can terminate only hosts we started, not other jobs on a
          # shared runner (issue #267).
          foreign_hosts=$(pgrep -x DockBridge 2>/dev/null | tr '\n' ',' || true)
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            log="/tmp/xcodebuild-test-attempt-${attempt}.log"
            xcresult="/tmp/xcodebuild-test-attempt-${attempt}.xcresult"
            rm -rf "$xcresult"
            echo "::group::xcodebuild test (attempt ${attempt}/${MAX_ATTEMPTS})"
            rc=0
            # tee keeps the run visible in real time and also on disk; without
            # it a SIGALRM kill could lose the buffered failure lines before
            # grep sees them (see issue #264).
            perl -e 'alarm 420; exec @ARGV or exit 127' -- \
              xcodebuild \
              -scheme DockBridge \
              -destination 'platform=macOS' \
              -configuration Debug \
              test-without-building \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 300 \
              -resultBundlePath "$xcresult" \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" 2>&1 | tee "$log" || rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            # Authoritative check: count failed tests in the .xcresult. If the
            # bundle is missing/corrupt (watchdog killed xcodebuild mid-write)
            # treat it as inconclusive and fall through to the log grep.
            xcresult_failed=""
            if [ -d "$xcresult" ]; then
              if xcresult_failed=$(
                xcrun xcresulttool get test-results summary --path "$xcresult" --format json 2>/dev/null \
                  | jq -r '.failedTests // empty' 2>/dev/null
              ) && [ -n "$xcresult_failed" ] && [ "$xcresult_failed" -gt 0 ]; then
                echo "::error::xcodebuild reported ${xcresult_failed} failed test(s) in the result bundle; failing without retry"
                exit "$rc"
              fi
            fi
            # Fallback: the log footer/assertion lines. Any match means a real
            # failure that must not be hidden by a retry.
            if grep -q "TEST EXECUTE FAILED" "$log" || grep -q "failed on '" "$log"; then
              exit "$rc"
            fi
            # Retry only an explicit watchdog kill (perl alarm => SIGALRM =>
            # exit 142). Any other nonzero exit (xcodebuild usage/destination
            # errors, crash) is deterministic and must fail fast.
            if [ "$rc" -eq 142 ] && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::xcodebuild test stalled (exit ${rc}); retrying once"
              # Kill leftover xcodebuild in this step's process group (the run
              # shell, perl -> exec xcodebuild, and its test subprocesses share
              # one PGID). Other jobs/workflows on a shared runner are in other
              # process groups, so `-g <pgid>` cannot reach them (issue #267).
              our_pgid=$(ps -o pgid= -p $$ | tr -d ' ')
              if [ -n "$our_pgid" ]; then
                pkill -g "$our_pgid" -f 'xcodebuild.*test-without-building' 2>/dev/null || true
              fi
              # TEST_HOST lives outside our_pgid. Kill only DockBridge PIDs that
              # appeared after this step started so the retry is a fresh host.
              for pid in $(pgrep -x DockBridge 2>/dev/null || true); do
                case ",${foreign_hosts}," in
                  *",${pid},"*) continue ;;
                esac
                kill "$pid" 2>/dev/null || true
              done
              sleep 5
              continue
            fi
            echo "::error::xcodebuild test failed (exit ${rc}, not a retryable stall)"
            exit "$rc"
          done
          echo "::error::xcodebuild test stalled after ${MAX_ATTEMPTS} attempts"
          exit 1

      # On failure or timeout the raw log and .xcresult are otherwise destroyed
      # with the runner, leaving no record of where the tests got to (issue
      # #266). Only run on failure/timeout (failure() is true both for a hard
      # test failure and for a step timeout that kills the test step), so
      # successful runs don't pay the artifact storage cost. Files that don't
      # exist (e.g. no retry happened) are simply not uploaded.
      - name: List failed tests from xcresult
        if: failure()
        run: |
          set -u
          for xcresult in /tmp/xcodebuild-test-attempt-*.xcresult; do
            [ -d "$xcresult" ] || continue
            echo "::group::Failed tests in ${xcresult}"
            xcrun xcresulttool get test-results summary --path "$xcresult" --format json 2>/dev/null \
              | jq -r '.testFailures[]? | "- \(.testName) [\(.targetName)]: \(.failureText)"' 2>/dev/null \
              || echo "(no xcresult summary available for ${xcresult})"
            echo "::endgroup::"
          done

      - name: Upload macOS test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-test-artifacts
          path: |
            /tmp/xcodebuild-test-attempt-*.log
            /tmp/xcodebuild-test-attempt-*.xcresult
          if-no-files-found: ignore
          retention-days: 14
          # .xcresult bundles are already compressed internally; re-compressing
          # them is wasted CPU. The plain-text logs are small, so leaving them
          # uncompressed keeps the artifact instantly grep-able.
          compression-level: 0
