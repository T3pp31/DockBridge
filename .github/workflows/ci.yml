name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test core crate
        run: cargo test -p dockbridge-core

      - name: Build workspace
        run: cargo build --workspace

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust static library
        run: ./scripts/build-rust.sh

      - name: Generate UniFFI bindings
        run: ./scripts/generate-uniffi.sh

      - name: Verify committed Swift bindings are up to date
        run: |
          if ! git diff --exit-code apps/macos/DockBridge/Generated/DockBridgeUniffi.swift; then
            echo "::error::DockBridgeUniffi.swift is out of date. Run ./scripts/generate-uniffi.sh locally and commit the result."
            exit 1
          fi

      - name: Build and test macOS app
        working-directory: apps/macos
        run: |
          xcodebuild \
            -scheme DockBridge \
            -destination 'platform=macOS' \
            -configuration Debug \
            build test \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""
