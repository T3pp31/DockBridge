name: Security audit (scheduled)

on:
  schedule:
    # Daily at 03:00 UTC so newly published RustSec advisories are caught even
    # when the repository has no recent commits.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  expiring-exceptions:
    name: Expiring advisory exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check that advisory exceptions have not expired
        run: |
          MISSING=0
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*\"(RUSTSEC-[0-9]+-[0-9]+)\" ]]; then
              id="${BASH_REMATCH[1]}"
              if ! grep -q "# expires: " <<<"$line"; then
                echo "error: ignore for $id has no '# expires: YYYY-MM-DD' comment" >&2
                MISSING=1
              else
                expiry="$(grep -oE '# expires: [0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$line" | awk '{print $3}')"
                if [[ -n "$expiry" ]] && [[ "$(date -u +%Y-%m-%d)" > "$expiry" ]]; then
                  echo "error: ignore for $id expired on $expiry" >&2
                  MISSING=1
                fi
              fi
            fi
          done < <(awk '/\[advisories\]/,/^\]/' .cargo/audit.toml | sed '/ignore = \[/d; /^\]/d' | grep -v '^[[:space:]]*#')
          if [[ "$MISSING" -ne 0 ]]; then
            echo "add or refresh an '# expires: YYYY-MM-DD' comment for every ignore entry" >&2
            exit 1
          fi
