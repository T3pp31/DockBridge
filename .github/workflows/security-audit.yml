name: Security audit (scheduled)

on:
  schedule:
    # Daily at 03:00 UTC so newly published RustSec advisories are caught even
    # when the repository has no recent commits.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # rustsec/audit-check records its result as a check run, which needs
      # checks: write (the same grant ci.yml's security-audit job has).
      checks: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  expiring-exceptions:
    name: Expiring advisory exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Parse audit.toml as TOML (via tomllib) so a one-line array or a
      # whitespace variation cannot bypass the expiry check (issue #1362).
      - name: Check that advisory exceptions have not expired
        run: python3 scripts/check-advisory-expiry.py
