name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true

# Key the group on the same `v<version>` tag the release job publishes to, so
# a manual dispatch for 1.0.0 and a v1.0.0 tag push serialize as one release
# instead of racing as release-1.0.0 vs release-v1.0.0 (issue #1364).
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  # Single source for the Xcode version used by the test and release jobs.
  XCODE_VERSION: '16.4'

jobs:
  # Gate publishing on the same test suites CI runs. A tag push does not run
  # ci.yml (it only triggers on main/pull_request), so without this job a
  # release could publish artifacts from an untested commit (issue #1365).
  test:
    name: Test before release
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Keep build-for-testing and test-without-building settings in sync.
      XCODEBUILD_SCHEME: "DockBridge"
      XCODEBUILD_DESTINATION: "platform=macOS"
      XCODEBUILD_CONFIGURATION: "Debug"
      XCODEBUILD_CODE_SIGN_IDENTITY: "-"
      XCODEBUILD_CODE_SIGNING_REQUIRED: "NO"
      XCODEBUILD_CODE_SIGNING_ALLOWED: "NO"
      XCODEBUILD_DEVELOPMENT_TEAM: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: release-test
          cache-bin: false

      - name: Test Rust workspace (all targets)
        run: cargo test --workspace --all-targets

      - name: Build Rust static library
        run: ./scripts/build-rust.sh

      - name: Generate UniFFI bindings
        run: ./scripts/generate-uniffi.sh

      # The macOS build/test steps below are copied verbatim from ci.yml
      # (including the testmanagerd watchdog and bounded retry) and kept in
      # sync by scripts/test-release-gating.py.
      - name: Build macOS app (for testing)
        timeout-minutes: 15
        working-directory: apps/macos
        env:
          # The CI steps above already built the static library and UniFFI
          # bindings, so the always-out-of-date preBuild phase skips its host
          # cargo build. Regenerating bindings from the same .a is idempotent.
          DOCKBRIDGE_SKIP_HOST_BUILD: "1"
        # build/test are split deliberately: combined `build test` hit the
        # Xcode 26 testmanagerd readiness hang on macos-latest (runs
        # 34044968127 / 34207249969 froze before "Testing started").
        run: |
          xcodebuild \
            -scheme "$XCODEBUILD_SCHEME" \
            -destination "$XCODEBUILD_DESTINATION" \
            -configuration "$XCODEBUILD_CONFIGURATION" \
            build-for-testing \
            CODE_SIGN_IDENTITY="$XCODEBUILD_CODE_SIGN_IDENTITY" \
            CODE_SIGNING_REQUIRED="$XCODEBUILD_CODE_SIGNING_REQUIRED" \
            CODE_SIGNING_ALLOWED="$XCODEBUILD_CODE_SIGNING_ALLOWED" \
            DEVELOPMENT_TEAM="$XCODEBUILD_DEVELOPMENT_TEAM"

      - name: Test macOS app
        # Kill hung test runs early instead of burning the job timeout:
        # run 34220128583 froze mid-test for 38 minutes on macos-latest
        # (runner-side testmanagerd stall, actions/runner-images#13096).
        # Time budget (watchdog, worst-case, per-test timeout, and how
        # timeout-minutes covers them): see docs/ci.md. Worst case here is
        # 420s + 5s + 420s = 845s (~14.1 min), covered by timeout-minutes: 18.
        timeout-minutes: 18
        working-directory: apps/macos
        env:
          DOCKBRIDGE_SKIP_HOST_BUILD: "1"
        # Runner-side stalls are flaky, not deterministic. A wall-clock guard
        # (perl alarm survives exec and SIGALRM-kills xcodebuild; gtimeout is
        # not preinstalled on macOS runners) distinguishes a hang (retry once
        # on a fresh testmanagerd) from a genuine test failure (fail fast,
        # never retried), preserving CI pass/fail semantics.
        #
        # Retry decision sources, in order of trust:
        #   1. .xcresult (written to disk by xcodebuild, immune to stdio
        #      buffering): if it contains any failed test, the failure is real
        #      and must never be retried. This is the authoritative check.
        #   2. Log grep (TEST EXECUTE FAILED / 'failed on ') as a fallback for
        #      the case where the watchdog SIGALRM-killed xcodebuild before the
        #      .xcresult was finalized (missing/corrupt bundle).
        # E2E/verify tests that are skipped (XCTSkip) never appear as failures,
        # so a zero-failure .xcresult is safe to treat as "no real failure".
        # Per-test allowance: -default-test-execution-time-allowance 300 gives
        # loaded runners a wide margin over the ~2 min normal suite (run
        # 34231056581 failed a unit test at exactly 120 s under load). The
        # Docker/SSH E2E tests are skipped on CI via XCTSkip, so this limit
        # only guards genuinely hung unit tests; the 300 s value stays well
        # under the 420 s watchdog so the watchdog still distinguishes a stall.
        run: |
          set -u -o pipefail
          if ! command -v perl >/dev/null 2>&1; then
            # Without perl the watchdog cannot run; fail fast instead of
            # letting exit 127 be misread as a hang and retried.
            echo "::error::perl not found; the test watchdog requires perl"
            exit 1
          fi
          MAX_ATTEMPTS=2
          # TEST_HOST (DockBridge) is launched by testmanagerd outside this
          # step's process group. Snapshot PIDs that already existed so retry
          # cleanup can terminate only hosts we started, not other jobs on a
          # shared runner (issue #267).
          foreign_hosts=$(pgrep -x DockBridge 2>/dev/null | tr '\n' ',' || true)
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            log="/tmp/xcodebuild-test-attempt-${attempt}.log"
            xcresult="/tmp/xcodebuild-test-attempt-${attempt}.xcresult"
            rm -rf "$xcresult"
            echo "::group::xcodebuild test (attempt ${attempt}/${MAX_ATTEMPTS})"
            rc=0
            # tee keeps the run visible in real time and also on disk; without
            # it a SIGALRM kill could lose the buffered failure lines before
            # grep sees them (see issue #264).
            perl -e 'alarm 420; exec @ARGV or exit 127' -- \
              xcodebuild \
              -scheme "$XCODEBUILD_SCHEME" \
              -destination "$XCODEBUILD_DESTINATION" \
              -configuration "$XCODEBUILD_CONFIGURATION" \
              test-without-building \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 300 \
              -resultBundlePath "$xcresult" \
              CODE_SIGN_IDENTITY="$XCODEBUILD_CODE_SIGN_IDENTITY" \
              CODE_SIGNING_REQUIRED="$XCODEBUILD_CODE_SIGNING_REQUIRED" \
              CODE_SIGNING_ALLOWED="$XCODEBUILD_CODE_SIGNING_ALLOWED" \
              DEVELOPMENT_TEAM="$XCODEBUILD_DEVELOPMENT_TEAM" 2>&1 | tee "$log" || rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            # Authoritative check: count failed tests in the .xcresult. If the
            # bundle is missing/corrupt (watchdog killed xcodebuild mid-write)
            # treat it as inconclusive and fall through to the log grep.
            xcresult_failed=""
            if [ -d "$xcresult" ]; then
              if xcresult_failed=$(
                xcrun xcresulttool get test-results summary --path "$xcresult" --format json 2>/dev/null \
                  | jq -r '.failedTests // empty' 2>/dev/null
              ) && [ -n "$xcresult_failed" ] && [ "$xcresult_failed" -gt 0 ]; then
                echo "::error::xcodebuild reported ${xcresult_failed} failed test(s) in the result bundle; failing without retry"
                exit "$rc"
              fi
            fi
            # Fallback: the log footer/assertion lines. Any match means a real
            # failure that must not be hidden by a retry.
            if grep -q "TEST EXECUTE FAILED" "$log" || grep -q "failed on '" "$log"; then
              exit "$rc"
            fi
            # Retry only an explicit watchdog kill (perl alarm => SIGALRM =>
            # exit 142). Any other nonzero exit (xcodebuild usage/destination
            # errors, crash) is deterministic and must fail fast.
            if [ "$rc" -eq 142 ] && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::xcodebuild test stalled (exit ${rc}); retrying once"
              # Kill leftover xcodebuild in this step's process group (the run
              # shell, perl -> exec xcodebuild, and its test subprocesses share
              # one PGID). Other jobs/workflows on a shared runner are in other
              # process groups, so `-g <pgid>` cannot reach them (issue #267).
              our_pgid=$(ps -o pgid= -p $$ | tr -d ' ')
              if [ -n "$our_pgid" ]; then
                pkill -g "$our_pgid" -f 'xcodebuild.*test-without-building' 2>/dev/null || true
              fi
              # TEST_HOST lives outside our_pgid. Kill only DockBridge PIDs that
              # appeared after this step started so the retry is a fresh host.
              for pid in $(pgrep -x DockBridge 2>/dev/null || true); do
                case ",${foreign_hosts}," in
                  *",${pid},"*) continue ;;
                esac
                kill "$pid" 2>/dev/null || true
              done
              sleep 5
              continue
            fi
            echo "::error::xcodebuild test failed (exit ${rc}, not a retryable stall)"
            exit "$rc"
          done
          echo "::error::xcodebuild test stalled after ${MAX_ATTEMPTS} attempts"
          exit 1

      # On failure or timeout the raw log and .xcresult are otherwise destroyed
      # with the runner, leaving no record of where the tests got to (issue
      # #266). Only run on failure/timeout (failure() is true both for a hard
      # test failure and for a step timeout that kills the test step), so
      # successful runs don't pay the artifact storage cost. Files that don't
      # exist (e.g. no retry happened) are simply not uploaded.
      - name: List failed tests from xcresult
        if: failure()
        run: |
          set -u
          for xcresult in /tmp/xcodebuild-test-attempt-*.xcresult; do
            [ -d "$xcresult" ] || continue
            echo "::group::Failed tests in ${xcresult}"
            xcrun xcresulttool get test-results summary --path "$xcresult" --format json 2>/dev/null \
              | jq -r '.testFailures[]? | "- \(.testName) [\(.targetName)]: \(.failureText)"' 2>/dev/null \
              || echo "(no xcresult summary available for ${xcresult})"
            echo "::endgroup::"
          done

      - name: Upload macOS test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-test-artifacts
          path: |
            /tmp/xcodebuild-test-attempt-*.log
            /tmp/xcodebuild-test-attempt-*.xcresult
          if-no-files-found: ignore
          retention-days: 14
          # .xcresult bundles are already compressed internally; re-compressing
          # them is wasted CPU. The plain-text logs are small, so leaving them
          # uncompressed keeps the artifact instantly grep-able.
          compression-level: 0

  release:
    name: Build and publish release
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Add Rust macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release version must be a SemVer value" >&2
            exit 1
          fi
          # A hyphen in build metadata does not make a release a prerelease.
          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          # Resolve the CLI artifact name once; the build, attestation, and
          # upload steps all read it from here (issue #1363).
          # Supports the same {app_name}/{version} placeholders as the other
          # *_name_template keys; anything left unresolved fails the release.
          CLI_TEMPLATE="$(bash scripts/release-config.sh cli_name_template)"
          CLI_APP_NAME="$(bash scripts/release-config.sh app_name)"
          CLI_NAME="${CLI_TEMPLATE//\{app_name\}/${CLI_APP_NAME}}"
          CLI_NAME="${CLI_NAME//\{version\}/${VERSION}}"
          if [[ "$CLI_NAME" == *[{}]* ]]; then
            echo "error: cli_name_template has an unsupported placeholder: ${CLI_TEMPLATE}" >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "cli_name=${CLI_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (CLI: ${CLI_NAME})"

      - name: Verify release.toml / Cargo.toml match the tag version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          release_version="$(bash scripts/release-config.sh version)"
          cargo_version="$(bash scripts/release-config.sh --cargo-version)"
          if [[ "$release_version" != "$VERSION" ]]; then
            echo "error: config/release.toml ($release_version) != tag version ($VERSION)" >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$VERSION" ]]; then
            echo "error: Cargo.toml ($cargo_version) != tag version ($VERSION)" >&2
            exit 1
          fi
          echo "release.toml and Cargo.toml match tag $VERSION"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="${VERSION}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if ! grep -q . "$NOTES_FILE"; then
            echo "error: no [${VERSION}] section found in CHANGELOG.md; add a section like:" >&2
            echo "## [${VERSION}] - YYYY-MM-DD" >&2
            echo "### Added" >&2
            echo "- ..." >&2
            echo "then re-run the release." >&2
            exit 1
          fi
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build hardened CLI
        run: |
          CLI_NAME="${{ steps.version.outputs.cli_name }}"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p dockbridge-cli --release --features disable-cli-password --target "$target"
          done
          lipo -create \
            target/aarch64-apple-darwin/release/dockbridge \
            target/x86_64-apple-darwin/release/dockbridge \
            -output "dist/${CLI_NAME}"
          (cd dist && shasum -a 256 "${CLI_NAME}" > "${CLI_NAME}.sha256")

      # Compile every Rust artifact the app packaging needs while no release
      # secret is present on the runner (issue #1227). The cargo invocations in
      # scripts/package-macos-release.sh then find fresh artifacts and do not
      # re-run dependency build scripts or proc macros after the import below.
      - name: Prebuild Rust app libraries before importing secrets
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            ./scripts/build-rust.sh "$target" release
          done
          cargo build -p dockbridge-uniffi --features cli --bin uniffi-bindgen --release

      - name: Import signing certificate and notary profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required}" ]]; then
              echo "error: missing release secret: ${required}" >&2
              exit 1
            fi
          done

          KEYCHAIN_PATH="${RUNNER_TEMP}/dockbridge-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN_PASSWORD_PATH="${RUNNER_TEMP}/dockbridge-keychain-password"
          IMPORT_COMPLETED=false

          cleanup() {
            rm -f "$CERT_PATH" "$KEYCHAIN_PASSWORD_PATH"
            if [[ "$IMPORT_COMPLETED" != "true" ]]; then
              security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          openssl rand -hex 32 > "$KEYCHAIN_PASSWORD_PATH"
          KEYCHAIN_PASSWORD="$(cat "$KEYCHAIN_PASSWORD_PATH")"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          xcrun notarytool store-credentials AC_NOTARY \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

          rm -f "$CERT_PATH" "$KEYCHAIN_PASSWORD_PATH"
          IMPORT_COMPLETED=true

      - name: Package macOS app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_AND_NOTARIZE: "true"
        run: ./scripts/package-macos-release.sh

      - name: Install cargo-cyclonedx
        run: |
          VERSION="$(bash scripts/release-config.sh cargo_cyclonedx_version)"
          cargo install cargo-cyclonedx --version "${VERSION}" --locked

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/generate-sbom.sh --out dist

      - name: Resolve asset paths
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLI_NAME="${{ steps.version.outputs.cli_name }}"
          APP_NAME="$(bash scripts/release-config.sh app_name)"
          ASSET_TEMPLATE="$(bash scripts/release-config.sh asset_name_template)"
          SBOM_TEMPLATE="$(bash scripts/release-config.sh sbom_name_template)"
          ASSET_NAME="${ASSET_TEMPLATE//\{app_name\}/${APP_NAME}}"
          ASSET_NAME="${ASSET_NAME//\{version\}/${VERSION}}"
          SBOM_NAME="${SBOM_TEMPLATE//\{app_name\}/${APP_NAME}}"
          SBOM_NAME="${SBOM_NAME//\{version\}/${VERSION}}"
          # Write outputs only after every key resolves, so a missing key
          # leaves $GITHUB_OUTPUT empty (the test asserts that).
          {
            echo "app_name=${APP_NAME}"
            echo "dmg=dist/${ASSET_NAME}"
            echo "sha256=dist/${ASSET_NAME}.sha256"
            echo "cli=dist/${CLI_NAME}"
            echo "cli_sha256=dist/${CLI_NAME}.sha256"
            echo "sbom=dist/${SBOM_NAME}"
            echo "sbom_sha256=dist/${SBOM_NAME}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.dmg }}
            ${{ steps.assets.outputs.cli }}
            ${{ steps.assets.outputs.sbom }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.assets.outputs.app_name }} ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            ${{ steps.assets.outputs.dmg }}
            ${{ steps.assets.outputs.sha256 }}
            ${{ steps.assets.outputs.cli }}
            ${{ steps.assets.outputs.cli_sha256 }}
            ${{ steps.assets.outputs.sbom }}
            ${{ steps.assets.outputs.sbom_sha256 }}
          generate_release_notes: false
