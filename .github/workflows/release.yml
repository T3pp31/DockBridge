name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: '16.4'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Add Rust macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release version must be a SemVer value" >&2
            exit 1
          fi
          # A hyphen in build metadata does not make a release a prerelease.
          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Verify release.toml / Cargo.toml match the tag version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          release_version="$(awk -F'"' '/^version = / { print $2; exit }' config/release.toml)"
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "$release_version" != "$VERSION" ]]; then
            echo "error: config/release.toml ($release_version) != tag version ($VERSION)" >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$VERSION" ]]; then
            echo "error: Cargo.toml ($cargo_version) != tag version ($VERSION)" >&2
            exit 1
          fi
          echo "release.toml and Cargo.toml match tag $VERSION"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          if awk -v ver="${VERSION}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | grep -q .; then
            awk -v ver="${VERSION}" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          else
            echo "error: no [${VERSION}] section found in CHANGELOG.md; add a section like:" >&2
            echo "## [${VERSION}] - YYYY-MM-DD" >&2
            echo "### Added" >&2
            echo "- ..." >&2
            echo "then re-run the release." >&2
            exit 1
          fi
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build hardened CLI
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p dockbridge-cli --release --features disable-cli-password --target "$target"
          done
          CLI_NAME="dockbridge-${VERSION}-macOS"
          lipo -create \
            target/aarch64-apple-darwin/release/dockbridge \
            target/x86_64-apple-darwin/release/dockbridge \
            -output "dist/${CLI_NAME}"
          (cd dist && shasum -a 256 "${CLI_NAME}" > "${CLI_NAME}.sha256")

      - name: Import signing certificate and notary profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required}" ]]; then
              echo "error: missing release secret: ${required}" >&2
              exit 1
            fi
          done

          KEYCHAIN_PATH="${RUNNER_TEMP}/dockbridge-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN_PASSWORD_PATH="${RUNNER_TEMP}/dockbridge-keychain-password"
          IMPORT_COMPLETED=false

          cleanup() {
            rm -f "$CERT_PATH" "$KEYCHAIN_PASSWORD_PATH"
            if [[ "$IMPORT_COMPLETED" != "true" ]]; then
              security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          openssl rand -hex 32 > "$KEYCHAIN_PASSWORD_PATH"
          KEYCHAIN_PASSWORD="$(cat "$KEYCHAIN_PASSWORD_PATH")"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          xcrun notarytool store-credentials AC_NOTARY \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

          rm -f "$CERT_PATH" "$KEYCHAIN_PASSWORD_PATH"
          IMPORT_COMPLETED=true

      - name: Package macOS app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_AND_NOTARIZE: "true"
        run: ./scripts/package-macos-release.sh

      - name: Install cargo-cyclonedx
        run: |
          VERSION="$(awk -F'"' '/^cargo_cyclonedx_version / { print $2; exit }' config/release.toml)"
          cargo install cargo-cyclonedx --version "${VERSION}" --locked

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/generate-sbom.sh --out dist

      - name: Resolve asset paths
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_NAME="$(awk -F'"' '/^app_name / { print $2; exit }' config/release.toml)"
          ASSET_TEMPLATE="$(awk -F'"' '/^asset_name_template / { print $2; exit }' config/release.toml)"
          SBOM_TEMPLATE="$(awk -F'"' '/^sbom_name_template / { print $2; exit }' config/release.toml)"
          ASSET_NAME="${ASSET_TEMPLATE//\{app_name\}/${APP_NAME}}"
          ASSET_NAME="${ASSET_NAME//\{version\}/${VERSION}}"
          SBOM_NAME="${SBOM_TEMPLATE//\{app_name\}/${APP_NAME}}"
          SBOM_NAME="${SBOM_NAME//\{version\}/${VERSION}}"
          CLI_NAME="dockbridge-${VERSION}-macOS"
          echo "dmg=dist/${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=dist/${ASSET_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "cli=dist/${CLI_NAME}" >> "$GITHUB_OUTPUT"
          echo "cli_sha256=dist/${CLI_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/${SBOM_NAME}" >> "$GITHUB_OUTPUT"
          echo "sbom_sha256=dist/${SBOM_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.dmg }}
            ${{ steps.assets.outputs.cli }}
            ${{ steps.assets.outputs.sbom }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DockBridge ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            ${{ steps.assets.outputs.dmg }}
            ${{ steps.assets.outputs.sha256 }}
            ${{ steps.assets.outputs.cli }}
            ${{ steps.assets.outputs.cli_sha256 }}
            ${{ steps.assets.outputs.sbom }}
            ${{ steps.assets.outputs.sbom_sha256 }}
          generate_release_notes: false
