name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true
        default: "0.1.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Add Rust macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          if awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | grep -q .; then
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          else
            echo "DockBridge ${VERSION}" > "$NOTES_FILE"
          fi
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build hardened CLI
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p dockbridge-cli --release --features disable-cli-password --target "$target"
          done
          CLI_NAME="dockbridge-${VERSION}-macOS"
          lipo -create \
            target/aarch64-apple-darwin/release/dockbridge \
            target/x86_64-apple-darwin/release/dockbridge \
            -output "dist/${CLI_NAME}"
          (cd dist && shasum -a 256 "${CLI_NAME}" > "${CLI_NAME}.sha256")

      - name: Package macOS app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_AND_NOTARIZE: "false"
        run: ./scripts/package-macos-release.sh

      - name: Install cargo-cyclonedx
        run: |
          VERSION="$(awk -F'"' '/^cargo_cyclonedx_version / { print $2; exit }' config/release.toml)"
          cargo install cargo-cyclonedx --version "${VERSION}" --locked

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/generate-sbom.sh --out dist

      - name: Resolve asset paths
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_NAME="$(awk -F'"' '/^app_name / { print $2; exit }' config/release.toml)"
          ASSET_TEMPLATE="$(awk -F'"' '/^asset_name_template / { print $2; exit }' config/release.toml)"
          SBOM_TEMPLATE="$(awk -F'"' '/^sbom_name_template / { print $2; exit }' config/release.toml)"
          ASSET_NAME="${ASSET_TEMPLATE//\{app_name\}/${APP_NAME}}"
          ASSET_NAME="${ASSET_NAME//\{version\}/${VERSION}}"
          SBOM_NAME="${SBOM_TEMPLATE//\{app_name\}/${APP_NAME}}"
          SBOM_NAME="${SBOM_NAME//\{version\}/${VERSION}}"
          CLI_NAME="dockbridge-${VERSION}-macOS"
          echo "dmg=dist/${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=dist/${ASSET_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "cli=dist/${CLI_NAME}" >> "$GITHUB_OUTPUT"
          echo "cli_sha256=dist/${CLI_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/${SBOM_NAME}" >> "$GITHUB_OUTPUT"
          echo "sbom_sha256=dist/${SBOM_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b  # v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          name: DockBridge ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            ${{ steps.assets.outputs.dmg }}
            ${{ steps.assets.outputs.sha256 }}
            ${{ steps.assets.outputs.cli }}
            ${{ steps.assets.outputs.cli_sha256 }}
            ${{ steps.assets.outputs.sbom }}
            ${{ steps.assets.outputs.sbom_sha256 }}
          generate_release_notes: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: |
            ${{ steps.assets.outputs.dmg }}
            ${{ steps.assets.outputs.cli }}
            ${{ steps.assets.outputs.sbom }}
