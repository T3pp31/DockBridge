name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true

# Key the group on the same `v<version>` tag the release job publishes to, so
# a manual dispatch for 1.0.0 and a v1.0.0 tag push serialize as one release
# instead of racing as release-1.0.0 vs release-v1.0.0 (issue #1364).
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  # Single source for the Xcode version used by the test and release jobs.
  XCODE_VERSION: '16.4'

jobs:
  # Gate publishing on the same test suites CI runs. A tag push does not run
  # ci.yml (it only triggers on main/pull_request), so without this job a
  # release could publish artifacts from an untested commit (issue #1365).
  test:
    name: Test before release
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test release workflow test gate
        run: python3 scripts/test-release-gating.py

      - name: Verify localization catalog (en + ja)
        run: ./scripts/verify-localization.sh

      - name: Guard Settings scene state wiring
        run: python3 scripts/test-settings-scene.py

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: release-test
          cache-bin: false

      - name: Test Rust workspace (all targets)
        run: cargo test --workspace --all-targets

      - name: Build Rust static library
        run: ./scripts/build-rust.sh "" debug

      - name: Generate UniFFI bindings
        run: ./scripts/generate-uniffi.sh "" debug

      - name: Install pinned XcodeGen
        run: |
          version="$(bash scripts/release-config.sh xcodegen_version)"
          checksum="$(bash scripts/release-config.sh xcodegen_sha256)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid xcodegen_version in config/release.toml"
            exit 1
          fi
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid xcodegen_sha256 in config/release.toml"
            exit 1
          fi
          archive="${RUNNER_TEMP}/xcodegen-${version}.zip"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${version}/xcodegen.zip"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify xcodeproj matches project.yml (xcodegen)
        run: |
          cd apps/macos
          xcodegen generate
          if ! git diff --exit-code DockBridge.xcodeproj; then
            echo "::error::DockBridge.xcodeproj is out of date. Run 'cd apps/macos && xcodegen generate' and commit the result."
            exit 1
          fi

      - name: Verify committed Swift bindings are up to date
        run: |
          if ! git diff --exit-code apps/macos/DockBridge/Generated/DockBridgeUniffi.swift; then
            echo "::error::DockBridgeUniffi.swift is out of date. Run ./scripts/generate-uniffi.sh locally and commit the result."
            exit 1
          fi

      - name: Build and test macOS app
        timeout-minutes: 33
        uses: ./.github/actions/run-macos-tests

      # Keep diagnostics outside the timed-out composite step so a step timeout
      # or Verify macOS test result counts failure still uploads logs/.xcresult (#266).
      - name: Upload macOS test diagnostics
        if: failure()
        uses: ./.github/actions/upload-macos-test-diagnostics

  build:
    # Build all Rust binaries, unsigned macOS app, and SBOM in an isolated job
    # with zero release secrets (issue #1227). Because Xcode's user script
    # sandboxing is disabled for Cargo, running every Cargo/build.rs/Xcode step
    # here prevents dependency build scripts from ever executing on a runner that
    # holds signing certificates or notarization credentials.
    name: Build unsigned release artifacts
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      cli_name: ${{ steps.version.outputs.cli_name }}
      app_name: ${{ steps.assets.outputs.app_name }}
      dmg: ${{ steps.assets.outputs.dmg }}
      sha256: ${{ steps.assets.outputs.sha256 }}
      cli: ${{ steps.assets.outputs.cli }}
      cli_sha256: ${{ steps.assets.outputs.cli_sha256 }}
      sbom: ${{ steps.assets.outputs.sbom }}
      sbom_sha256: ${{ steps.assets.outputs.sbom_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable (tag via rust-toolchain.toml)

      - name: Add Rust macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release version must be a SemVer value" >&2
            exit 1
          fi
          # A hyphen in build metadata does not make a release a prerelease.
          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          # Resolve the CLI artifact name once; the build, attestation, and
          # upload steps all read it from here (issue #1363, #1431).
          CLI_NAME="$(bash scripts/release-config.sh --expand cli_name_template --version "$VERSION")"
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "cli_name=${CLI_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (CLI: ${CLI_NAME})"

      - name: Verify release.toml / Cargo.toml match the tag version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          release_version="$(bash scripts/release-config.sh version)"
          cargo_version="$(bash scripts/release-config.sh --cargo-version)"
          if [[ "$release_version" != "$VERSION" ]]; then
            echo "error: config/release.toml ($release_version) != tag version ($VERSION)" >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$VERSION" ]]; then
            echo "error: Cargo.toml ($cargo_version) != tag version ($VERSION)" >&2
            exit 1
          fi
          echo "release.toml and Cargo.toml match tag $VERSION"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="${VERSION}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if ! grep -q . "$NOTES_FILE"; then
            echo "error: no [${VERSION}] section found in CHANGELOG.md; add a section like:" >&2
            echo "## [${VERSION}] - YYYY-MM-DD" >&2
            echo "### Added" >&2
            echo "- ..." >&2
            echo "then re-run the release." >&2
            exit 1
          fi
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build hardened CLI
        run: |
          CLI_NAME="${{ steps.version.outputs.cli_name }}"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p dockbridge-cli --release --features disable-cli-password --target "$target"
          done
          lipo -create \
            target/aarch64-apple-darwin/release/dockbridge \
            target/x86_64-apple-darwin/release/dockbridge \
            -output "dist/${CLI_NAME}"
          (cd dist && shasum -a 256 "${CLI_NAME}" > "${CLI_NAME}.sha256")

      - name: Build unsigned macOS app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_AND_NOTARIZE: "false"
          PACKAGE_APP_ONLY: "true"
          APP_ARCHIVE_PATH: dist/unsigned-app.zip
        run: ./scripts/package-macos-release.sh

      - name: Install cargo-cyclonedx
        run: |
          VERSION="$(bash scripts/release-config.sh cargo_cyclonedx_version)"
          cargo install cargo-cyclonedx --version "${VERSION}" --locked

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/generate-sbom.sh --out dist

      - name: Resolve asset paths
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLI_NAME="${{ steps.version.outputs.cli_name }}"
          APP_NAME="$(bash scripts/release-config.sh app_name)"
          ASSET_NAME="$(bash scripts/release-config.sh --expand asset_name_template --version "$VERSION" --app-name "$APP_NAME")"
          SBOM_NAME="$(bash scripts/release-config.sh --expand sbom_name_template --version "$VERSION" --app-name "$APP_NAME")"
          # Write outputs only after every key resolves, so a missing key
          # leaves $GITHUB_OUTPUT empty (the test asserts that).
          {
            echo "app_name=${APP_NAME}"
            echo "dmg=dist/${ASSET_NAME}"
            echo "sha256=dist/${ASSET_NAME}.sha256"
            echo "cli=dist/${CLI_NAME}"
            echo "cli_sha256=dist/${CLI_NAME}.sha256"
            echo "sbom=dist/${SBOM_NAME}"
            echo "sbom_sha256=dist/${SBOM_NAME}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release notes for artifact upload
        run: |
          mkdir -p dist
          cp "${{ steps.notes.outputs.path }}" dist/release-notes.md

      - name: Upload unsigned release build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-build-artifacts
          path: |
            dist/unsigned-app.zip
            dist/release-notes.md
            ${{ steps.assets.outputs.cli }}
            ${{ steps.assets.outputs.cli_sha256 }}
            ${{ steps.assets.outputs.sbom }}
            ${{ steps.assets.outputs.sbom_sha256 }}
          if-no-files-found: error
          retention-days: 1

  release:
    # Sign, notarize, package DMG, attest, and publish on a clean runner that
    # never executes Cargo, dependency build scripts, or Xcode builds (issue #1227).
    name: Sign, notarize, and publish release
    needs: [test, build]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Download unsigned release build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-build-artifacts
          path: dist

      - name: Extract unsigned macOS app
        run: |
          mkdir -p "${RUNNER_TEMP}/prebuilt-app"
          ditto -x -k dist/unsigned-app.zip "${RUNNER_TEMP}/prebuilt-app"
          chmod +x "${{ needs.build.outputs.cli }}"

      - name: Import signing certificate and notary profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required}" ]]; then
              echo "error: missing release secret: ${required}" >&2
              exit 1
            fi
          done

          KEYCHAIN_PATH="${RUNNER_TEMP}/dockbridge-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN_PASSWORD_PATH="${RUNNER_TEMP}/dockbridge-keychain-password"
          IMPORT_COMPLETED=false

          cleanup() {
            rm -f "$CERT_PATH" "$KEYCHAIN_PASSWORD_PATH"
            if [[ "$IMPORT_COMPLETED" != "true" ]]; then
              security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          openssl rand -hex 32 > "$KEYCHAIN_PASSWORD_PATH"
          KEYCHAIN_PASSWORD="$(cat "$KEYCHAIN_PASSWORD_PATH")"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          xcrun notarytool store-credentials AC_NOTARY \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

          rm -f "$CERT_PATH" "$KEYCHAIN_PASSWORD_PATH"
          IMPORT_COMPLETED=true

      - name: Sign, notarize, and package macOS app
        env:
          VERSION: ${{ needs.build.outputs.version }}
          APP_NAME: ${{ needs.build.outputs.app_name }}
          PREBUILT_APP_PATH: ${{ runner.temp }}/prebuilt-app/${{ needs.build.outputs.app_name }}.app
          SIGN_AND_NOTARIZE: "true"
        run: ./scripts/package-macos-release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            ${{ needs.build.outputs.dmg }}
            ${{ needs.build.outputs.cli }}
            ${{ needs.build.outputs.sbom }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.build.outputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.app_name }} ${{ needs.build.outputs.version }}
          body_path: dist/release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            ${{ needs.build.outputs.dmg }}
            ${{ needs.build.outputs.sha256 }}
            ${{ needs.build.outputs.cli }}
            ${{ needs.build.outputs.cli_sha256 }}
            ${{ needs.build.outputs.sbom }}
            ${{ needs.build.outputs.sbom_sha256 }}
          generate_release_notes: false
