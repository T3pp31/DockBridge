# Required companion for dev-install-unsigned.command. Keep both files together
# when copying the development installer beside DockBridge.app.
# The installer sources this file from its own directory.
# Both fields are required positive integers (seconds); the poll interval must
# not exceed the timeout. An app that remains alive is never overwritten.
INSTALL_EXIT_TIMEOUT_SECONDS=30
INSTALL_EXIT_POLL_INTERVAL_SECONDS=1
