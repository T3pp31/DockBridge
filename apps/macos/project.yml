name: DockBridge
options:
  bundleIdPrefix: com.dockbridge
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages: {}
targets:
  DockBridge:
    type: application
    platform: macOS
    sources:
      - path: DockBridge
        excludes:
          - Generated/Headers
    settings:
      base:
        PRODUCT_NAME: DockBridge
        PRODUCT_BUNDLE_IDENTIFIER: com.dockbridge.app
        INFOPLIST_FILE: DockBridge/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DockBridge/Resources/DockBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DOCKBRIDGE_FFI_STUB
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(PROJECT_DIR)/../../target/release/libdockbridge_uniffi.a
          - -lc++
          - -framework
          - Security
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/DockBridge/Generated/Headers
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: Generate UniFFI Bindings
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}"
          ROOT="${SRCROOT}/../.."
          "${ROOT}/scripts/build-rust.sh" "" release
          "${ROOT}/scripts/generate-uniffi.sh" "" release
    postBuildScripts:
      - name: Generate Dock App Icon icns
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          OUT="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}/Contents/Resources/AppIcon.icns"
          "${SRCROOT}/../../scripts/generate-app-icon-icns.sh" "$OUT"
schemes:
  DockBridge:
    build:
      targets:
        DockBridge: all
    run:
      config: Debug
