name: DockBridge
options:
  xcodeVersion: "16.0"
  bundleIdPrefix: com.dockbridge
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    # DEVELOPMENT_TEAM is intentionally NOT hardcoded here; supply it per-developer
    # via Local.xcconfig or -allowProvisioningUpdates. CI uses CODE_SIGNING_ALLOWED=NO.
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Disabled because the preBuild phase runs `cargo`, which reaches the
    # Cargo registry, git checkouts, and build-script temp files outside the
    # declared inputs; the sandbox would reject those accesses and break every
    # build. Consequence: dependency build.rs files run unsandboxed, so treat
    # dependency updates as code review (see docs/security.md, issue #1227).
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages: {}
targets:
  DockBridge:
    type: application
    platform: macOS
    sources:
      - path: DockBridge
        excludes:
          - Generated/Headers
    settings:
      base:
        PRODUCT_NAME: DockBridge
        PRODUCT_BUNDLE_IDENTIFIER: com.dockbridge.app
        INFOPLIST_FILE: DockBridge/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DockBridge/Resources/DockBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(PROJECT_DIR)/../../target/$(RUST_PROFILE)/libdockbridge_uniffi.a
          - -lc++
          - -framework
          - Security
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/DockBridge/Generated/Headers
      configs:
        Debug:
          RUST_PROFILE: debug
        Release:
          RUST_PROFILE: release
          ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: Generate UniFFI Bindings
        shell: /bin/bash
        # Track nested Rust sources via a generated .d dependency file so Xcode
        # skips this phase when only Swift files change, and re-runs whenever
        # any Rust source, Cargo manifest, UDL, or build script changes (issue #616).
        basedOnDependencyAnalysis: true
        discoveredDependencyFile: $(DERIVED_FILE_DIR)/uniffi-bindings.d
        inputFiles:
          - $(PROJECT_DIR)/../../Cargo.lock
          - $(PROJECT_DIR)/../../Cargo.toml
          - $(PROJECT_DIR)/../../rust-toolchain.toml
          - $(PROJECT_DIR)/../../crates/uniffi/src/dockbridge_uniffi.udl
          - $(PROJECT_DIR)/../../scripts/build-rust.sh
          - $(PROJECT_DIR)/../../scripts/generate-uniffi.sh
          - $(PROJECT_DIR)/../../scripts/write-uniffi-depfile.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/uniffi-bindings.stamp
          - $(PROJECT_DIR)/../../target/$(RUST_PROFILE)/libdockbridge_uniffi.a
          - $(SRCROOT)/DockBridge/Generated/DockBridgeUniffi.swift
          - $(SRCROOT)/DockBridge/Generated/Headers/dockbridge_uniffiFFI.h
          - $(SRCROOT)/DockBridge/Generated/Headers/module.modulemap
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          ROOT="$SRCROOT/../.."
          PROFILE="${RUST_PROFILE:-release}"
          "$ROOT/scripts/generate-uniffi.sh" "" "$PROFILE"
          "$ROOT/scripts/write-uniffi-depfile.sh" \
            "$ROOT" \
            "$DERIVED_FILE_DIR/uniffi-bindings.stamp" \
            "$DERIVED_FILE_DIR/uniffi-bindings.d"
    postBuildScripts:
      - name: Generate Dock App Icon icns
        shell: /bin/bash
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../../scripts/generate-app-icon-icns.sh
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_128x128.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_16x16.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_16x16@2x.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_256x256.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_256x256@2x.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_32x32.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_32x32@2x.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png
          - $(SRCROOT)/DockBridge/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/AppIcon.icns
        script: |
          set -euo pipefail
          OUT="$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME/Contents/Resources/AppIcon.icns"
          "$SRCROOT/../../scripts/generate-app-icon-icns.sh" "$OUT"
  DockBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DockBridgeTests
    dependencies:
      - target: DockBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dockbridge.appTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DockBridge.app/Contents/MacOS/DockBridge
        BUNDLE_LOADER: $(TEST_HOST)
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/DockBridge/Generated/Headers
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  DockBridge:
    build:
      targets:
        DockBridge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DockBridgeTests
          parallelizable: true
